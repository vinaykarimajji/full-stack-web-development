<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Product Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .calculator {
            background: white;
            width: 350px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #007bff;
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            background: #eaf4ff;
            border-radius: 10px;
            text-align: center;
        }

        .result h2 {
            margin: 0;
            color: #007bff;
        }

        #totalPrice {
            font-size: 28px;
            font-weight: bold;
            color: #222;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <h1>Product Calculator</h1>

        <label for="productName">Product Name</label>
        <input type="text" id="productName"
               placeholder="Enter product name">

        <label for="quantity">Quantity</label>
        <input type="number" id="quantity"
               min="0" value="1">

        <label for="price">Price per Product (₹)</label>
        <input type="number" id="price"
               min="0" value="100">

        <div class="result">
            <h2>Total Price</h2>
            <p id="totalPrice">₹100.00</p>
        </div>

    </div>

    <script>

        // Function to calculate total price
        function calculateTotal() {

            // Get values from input fields
            let quantity = Number(
                document.getElementById("quantity").value
            );

            let price = Number(
                document.getElementById("price").value
            );

            // Calculate total
            let total = quantity * price;

            // Display the result
            document.getElementById("totalPrice").textContent =
                "₹" + total.toFixed(2);
        }

        // Event listener for quantity
        document.getElementById("quantity")
            .addEventListener("input", calculateTotal);

        // Event listener for price
        document.getElementById("price")
            .addEventListener("input", calculateTotal);

    </script>

</body>
</html>
